<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Práctica 01</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);
    import {RoundedBoxGeometry} from "./js/RoundedBoxGeometry.js"

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 25);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
// 😃😃 Grids

var gridHelper = new THREE.GridHelper(100,100);
//scene.add(gridHelper);

var polargrid = new THREE.PolarGridHelper(50,50,40,40);
//scene.add(polargrid);

//😁 EJES

var axes = new THREE.AxesHelper(100);
//scene.add(axes);






// Espacio para colocar los objetos

///  💫💢🐭🐭 LUCES



//OBJETOS  ✏️✏️✏️✏️  🪶





//  CERVEZA (Posición X: 0)
var cervezaGrupo03 = new THREE.Group();

// Materiales
var materialVidrioFinal = new THREE.MeshBasicMaterial({ color: 0x8b4513, side: THREE.DoubleSide });
var materialEtiqueta = new THREE.MeshBasicMaterial({ color: 0xf5f5dc, side: THREE.DoubleSide });
var materialTapa = new THREE.MeshBasicMaterial({ color: 0xffd700, side: THREE.DoubleSide });

// Cuerpo
var meshCuerpoFinal = new THREE.Mesh(
    new THREE.CylinderGeometry(4, 4, 12, 32),
    materialVidrioFinal
);
meshCuerpoFinal.position.set(0, 6, 0);
cervezaGrupo03.add(meshCuerpoFinal);

// Curva / Hombros
var meshCurvaFinal = new THREE.Mesh(
    new THREE.SphereGeometry(4, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2),
    materialVidrioFinal
);
meshCurvaFinal.position.set(0, 10, 0);
cervezaGrupo03.add(meshCurvaFinal);

// Cuello
var meshCuelloFinal = new THREE.Mesh(
    new THREE.CylinderGeometry(1.5, 1.5, 8, 32),
    materialVidrioFinal
);
meshCuelloFinal.position.set(0, 14, 0);
cervezaGrupo03.add(meshCuelloFinal);

// Etiqueta
var meshEtiqueta = new THREE.Mesh(
    new THREE.CylinderGeometry(4.05, 4.05, 5, 32),
    materialEtiqueta
);
meshEtiqueta.position.set(0, 6, 0);
cervezaGrupo03.add(meshEtiqueta);

// Corcholata / Tapa
var meshTapa = new THREE.Mesh(
    new THREE.CylinderGeometry(1.7, 1.7, 0.8, 32),
    materialTapa
);
meshTapa.position.set(0, 18.4, 0);
cervezaGrupo03.add(meshTapa);

cervezaGrupo03.position.set(0, 0, 0);
scene.add(cervezaGrupo03);

































//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {
    //🪄🪄 Animación - 





    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();
    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
