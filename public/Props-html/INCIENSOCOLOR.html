<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Práctica 01</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
    }
</script>

<script type="module"> 

//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);

    import {RoundedBoxGeometry} from "./js/RoundedBoxGeometry.js"


//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas

    var renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('myCanvas'), 
        antialias: true,
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos

    var scene = new THREE.Scene();


//🎥🎥 Agregar una cámara de perspectiva

    var camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        2000
    );

    scene.add(camera);


// Settings de la cámara

    camera.position.set(0, 4, 25);


// Añadiendo los OrbitControls

    var controls = new OrbitControls(camera, renderer.domElement);

    controls.enableDamping = true;
    controls.dampingFactor = 0.05;


// GridHelper

    var gridHelper = new THREE.GridHelper (300,300);

    //scene.add(gridHelper);

    var axesHelper = new THREE.AxesHelper(50);

    //scene.add(axesHelper);


// Espacio para colocar los objetos


///  💫💢🐭🐭 LUCES

var luz = new THREE.DirectionalLight(0xffffff,2);

luz.position.set(5, 10, 5);

scene.add(luz);

var luzAmbiente = new THREE.AmbientLight(0xffffff,1);

scene.add(luzAmbiente);


// OBJETOS  ✏️✏️✏️✏️  🪶

// INCIENSO

// 🎨 MATERIALES

// base

    var materialBase = new THREE.MeshStandardMaterial({color: 0x6B3E26});
// palo del incienso
var materialPalo = new THREE.MeshStandardMaterial({color: 0x111111});


// BASE

// Geometría de la base del incienso
var geometriaBase = new RoundedBoxGeometry( 8, 2.5, 3, 0.4, 5);
var baseIncienso = new THREE.Mesh(geometriaBase,materialBase);

// Posición de la base

baseIncienso.position.set(0, 2, 0);
scene.add(baseIncienso);

// VARITA DE INCIENSO

var geometriaVarita = new THREE.CylinderGeometry(0.18, 0.18, 6, 16);
var varitaIncienso = new THREE.Mesh(geometriaVarita,materialPalo);
varitaIncienso.rotation.z=-0.65; varitaIncienso.position.set( -0.5, 4, 0);
scene.add(varitaIncienso);



//🎰🎰 Rendering y animación

    requestAnimationFrame(render);


    function render() {

    //🪄🪄 Animación - 


    //🎮🎮 Actualización del OrbitControls para generar la suavidad de movimiento

        controls.update();


    // Llamado para renderizar y volver a llamar a la misma función (render)

        renderer.render(scene, camera);

        requestAnimationFrame(render);
    }

</script>
</body>
</html>
