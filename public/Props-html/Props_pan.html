<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Práctica 01</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);
    import {RoundedBoxGeometry} from "./js/RoundedBoxGeometry.js"

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 25);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
// 😃😃 Grids

var gridHelper = new THREE.GridHelper(100,100);
//scene.add(gridHelper);

var polargrid = new THREE.PolarGridHelper(50,50,40,40);
//scene.add(polargrid);

//😁 EJES

var axes = new THREE.AxesHelper(100);
//scene.add(axes);






// Espacio para colocar los objetos

///  💫💢🐭🐭 LUCES



//OBJETOS  ✏️✏️✏️✏️  🪶






// PAN DE MUERTO (Posición X: 25)
var panMuertoGrupo03 = new THREE.Group();

// Materiales
var materialMasa03 = new THREE.MeshBasicMaterial({ color: 0xc47f38, side: THREE.DoubleSide });
var materialAzucar03 = new THREE.MeshBasicMaterial({ color: 0xfffcf0, side: THREE.DoubleSide });

// Masa principal (Media esfera)
var meshMasa03 = new THREE.Mesh(
    new THREE.SphereGeometry(10, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2),
    materialMasa03
);
meshMasa03.position.set(0, 0, 0);
panMuertoGrupo03.add(meshMasa03);

// Huesitos (Esferas)
var geometryEsferita03 = new THREE.SphereGeometry(1.8, 16, 16);

// Tira Derecha
var m01 = new THREE.Mesh(geometryEsferita03, materialAzucar03); m01.position.set(4, 9, 0);
var m02 = new THREE.Mesh(geometryEsferita03, materialAzucar03); m02.position.set(8, 6, 0);
panMuertoGrupo03.add(m01, m02);

// Tira Izquierda
var m03 = new THREE.Mesh(geometryEsferita03, materialAzucar03); m03.position.set(-4, 9, 0);
var m04 = new THREE.Mesh(geometryEsferita03, materialAzucar03); m04.position.set(-8, 6, 0);
panMuertoGrupo03.add(m03, m04);

// Tira Frente
var m05 = new THREE.Mesh(geometryEsferita03, materialAzucar03); m05.position.set(0, 9, 4);
var m06 = new THREE.Mesh(geometryEsferita03, materialAzucar03); m06.position.set(0, 6, 8);
panMuertoGrupo03.add(m05, m06);

// Tira Atrás
var m07 = new THREE.Mesh(geometryEsferita03, materialAzucar03); m07.position.set(0, 9, -4);
var m08 = new THREE.Mesh(geometryEsferita03, materialAzucar03); m08.position.set(0, 6, -8);
panMuertoGrupo03.add(m07, m08);

// Centro / Bolita superior
var meshCentro03 = new THREE.Mesh(
    new THREE.SphereGeometry(2.5, 16, 16),
    materialAzucar03
);
meshCentro03.position.set(0, 10.2, 0);
panMuertoGrupo03.add(meshCentro03);

panMuertoGrupo03.position.set(25, 0, 0);
scene.add(panMuertoGrupo03);






































//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {
    //🪄🪄 Animación - 





    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();
    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
